name: TEST pykrx 투자자별 순매수 조회

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Naver 시장 전체 투자자별 매매동향 - 헤더 확인
        run: |
          python3 <<'EOF'
          import urllib.request, re

          headers = {'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'}
          for market_label, url in [
              ('기본(파라미터 없음)', 'https://finance.naver.com/sise/investorDealTrendDay.naver?bizdate=20260831'),
          ]:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as r:
                  body = r.read().decode('euc-kr', errors='replace')
              # th 헤더 텍스트 전부 추출
              ths = re.findall(r'<th[^>]*>(.*?)</th>', body, re.S)
              ths = [re.sub('<.*?>', ' ', t).strip() for t in ths]
              ths = [t for t in ths if t]
              print(f'=== {market_label} th 목록 ===')
              print(ths)

              # KOSPI/KOSDAQ 구분 있는지 select box 옵션 확인
              opts = re.findall(r'<option[^>]*value="([^"]*)"[^>]*>([^<]*)</option>', body)
              print('select option들:', opts[:20])
          EOF

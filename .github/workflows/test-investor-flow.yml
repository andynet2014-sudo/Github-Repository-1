name: TEST pykrx 투자자별 순매수 조회

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Naver 외국인/기관 순매매 테스트
        run: |
          python3 <<'EOF'
          import urllib.request

          headers = {'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'}

          for code, name in [('005930', '삼성전자'), ('000660', 'SK하이닉스')]:
              url = f'https://finance.naver.com/item/frgn.naver?code={code}&page=1'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body = r.read().decode('euc-kr', errors='replace')
                      print(f'=== {name} status {r.status}, 길이 {len(body)} ===')
                      # 테이블 부분만 대충 잘라서 확인
                      idx = body.find('외국인')
                      print(body[idx-200:idx+1500] if idx > 0 else '외국인 문자열 못찾음')
              except Exception as e:
                  print(f'{name} 실패:', repr(e))
              print()

          # 모바일 API 버전도 시도 (JSON)
          for code, name in [('005930', '삼성전자')]:
              url = f'https://m.stock.naver.com/api/stock/{code}/investorTrend?page=1&pageSize=5'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body = r.read()
                      print(f'=== 모바일 API {name} status {r.status} ===')
                      print(body[:1000])
              except Exception as e:
                  print(f'모바일 API {name} 실패:', repr(e))
          EOF

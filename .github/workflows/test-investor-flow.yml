name: TEST pykrx 투자자별 순매수 조회

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: KRX raw 요청 진단
        run: |
          python3 <<'EOF'
          import urllib.request, urllib.parse

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36',
              'Referer': 'http://data.krx.co.kr/contents/MDC/MDI/mdiLoader/index.cmd?menuId=MDC0201020103',
          }

          # 1) OTP 발급 요청
          otp_url = 'http://data.krx.co.kr/comm/fileDn/GenerateOTP/generate.cmd'
          otp_params = {
              'locale': 'ko_KR',
              'mktId': 'STK',
              'strtDd': '20260827',
              'endDd': '20260831',
              'isuCd': 'KR7005930003',
              'param1isuCd_finder_stkisu0_0': '',
              'trdVolVal': 'trdVal',
              'askBid': '3',
              'name': 'fileDown',
              'url': 'dbms/MDC/STAT/standard/MDCSTAT02203',
          }
          req = urllib.request.Request(otp_url + '?' + urllib.parse.urlencode(otp_params), headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  otp = r.read()
                  print('OTP status:', r.status)
                  print('OTP body (앞 300자):', otp[:300])
          except Exception as e:
              print('OTP 요청 실패:', repr(e))
              otp = None

          if otp:
              down_url = 'http://data.krx.co.kr/comm/fileDn/download_csv/download.cmd'
              req2 = urllib.request.Request(down_url, data=urllib.parse.urlencode({'code': otp}).encode(), headers={**headers, 'Content-Type': 'application/x-www-form-urlencoded'})
              try:
                  with urllib.request.urlopen(req2, timeout=10) as r:
                      body = r.read()
                      print('DOWNLOAD status:', r.status)
                      print('DOWNLOAD body (앞 500자):', body[:500])
              except Exception as e:
                  print('DOWNLOAD 요청 실패:', repr(e))
          EOF

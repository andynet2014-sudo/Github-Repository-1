name: TEST pykrx 투자자별 순매수 조회

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pykrx 설치
        run: pip install pykrx

      - name: pykrx 버전/함수 시그니처 확인
        run: |
          python3 -c "
          import pykrx, inspect
          from pykrx import stock
          print('pykrx version:', pykrx.__version__ if hasattr(pykrx,'__version__') else '?')
          print(inspect.signature(stock.get_market_trading_value_by_date))
          print(inspect.signature(stock.get_market_trading_value_by_investor))
          "

      - name: 투자자별 순매수 테스트 (detail 없이)
        run: |
          python3 <<'EOF'
          from pykrx import stock
          import pandas as pd
          pd.set_option('display.max_columns', None)
          pd.set_option('display.width', 200)

          FROM, TO = '20260827', '20260831'

          for name, code in [('삼성전자', '005930'), ('SK하이닉스', '000660')]:
              print(f"\n=== {name}({code}) 투자자별 순매수대금 (detail 없음) ===")
              try:
                  df = stock.get_market_trading_value_by_date(FROM, TO, code)
                  print(df)
              except Exception as e:
                  print("에러:", repr(e))

          print("\n=== KOSPI 지수 투자자별 순매수대금 (get_market_trading_value_by_investor, 단일일자 8/29) ===")
          try:
              df = stock.get_market_trading_value_by_investor('20260828', '20260828', 'KOSPI')
              print(df)
          except Exception as e:
              print("에러:", repr(e))
          EOF

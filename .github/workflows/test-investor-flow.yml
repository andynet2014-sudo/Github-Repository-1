name: TEST pykrx 투자자별 순매수 조회

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 개별 종목 기타법인 포함 금액 breakdown 탐색
        run: |
          python3 <<'EOF'
          import urllib.request, re

          headers = {'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'}

          candidates = [
              'https://finance.naver.com/item/investorDealTrend.naver?code=005930',
              'https://finance.naver.com/item/investorDealTrendDay.naver?code=005930',
              'https://finance.naver.com/item/frgn.naver?code=005930&frgn_switch=1',
              'https://m.stock.naver.com/api/stock/005930/investorTrend',
              'https://m.stock.naver.com/api/domestic/stock/005930/trend/foreign',
              'https://m.stock.naver.com/front-api/frgn/foreignerAndInstitutionsTrend?stockCode=005930',
          ]
          for url in candidates:
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=8) as r:
                      body = r.read()
                      print(f'{url}\n  -> status {r.status}, 길이 {len(body)}, 앞부분: {body[:200]!r}\n')
              except Exception as e:
                  print(f'{url}\n  -> 실패: {repr(e)}\n')
          EOF

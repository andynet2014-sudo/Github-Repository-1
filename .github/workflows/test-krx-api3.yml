name: TEST KRX Open API 승인 후 재확인

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 승인된 키로 엔드포인트 재확인
        env:
          KRX_KEY: ${{ secrets.KRX_MARKETPLACE_API }}
        run: |
          python3 <<'EOF'
          import urllib.request, os

          key = os.environ['KRX_KEY'].strip()
          print('key length:', len(key), 'ascii:', key.isascii())

          candidates = [
              ('AUTH_KEY', 'http://data-dbg.krx.co.kr/svc/apis/sto/stk_bydd_trd?basDd=20260903'),
              ('AUTH_KEY', 'https://data-dbg.krx.co.kr/svc/apis/sto/stk_bydd_trd?basDd=20260903'),
              ('AUTH_KEY', 'http://data-dbg.krx.co.kr/svc/apis/sto/stk_invsto_trd?basDd=20260903'),
              ('AUTH_KEY', 'http://data-dbg.krx.co.kr/svc/apis/idx/kospi_dd_trd?basDd=20260903'),
              # 혹시 대문자 헤더가 아니라 다른 이름/방식일 경우 대비
              ('Authorization', 'http://data-dbg.krx.co.kr/svc/apis/sto/stk_bydd_trd?basDd=20260903'),
          ]
          for header_name, url in candidates:
              headers = {header_name: key}
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body = r.read()
                      print(f'[{header_name}] {url}\n  -> status {r.status}, len {len(body)}, head: {body[:400]!r}\n')
              except urllib.error.HTTPError as e:
                  err_body = e.read()[:300]
                  print(f'[{header_name}] {url}\n  -> HTTPError {e.code}: {e.reason}, body: {err_body!r}\n')
              except Exception as e:
                  print(f'[{header_name}] {url}\n  -> fail: {repr(e)}\n')
          EOF

name: TEST 페이지네이션 범위 확인

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: frgn.naver page 파라미터 + market bizdate 범위 테스트
        run: |
          python3 <<'EOF'
          import urllib.request, re

          headers = {'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as r:
                  return r.read().decode('euc-kr', errors='replace')

          def rows_of(html, cls):
              tables = re.findall(r'<table[^>]*class="%s"[^>]*>(.*?)</table>' % cls, html, re.S)
              out = []
              for t in tables:
                  for row in re.findall(r'<tr[^>]*>(.*?)</tr>', t, re.S):
                      cells = re.findall(r'<td[^>]*>(.*?)</td>', row, re.S)
                      cells = [re.sub('<[^>]+>', '', c).strip() for c in cells]
                      cells = [c for c in cells if c]
                      if cells:
                          out.append(cells)
              return out

          print('=== frgn.naver page test (005930) ===')
          for page in [1, 5, 10, 17, 18]:
              html = get(f'https://finance.naver.com/item/frgn.naver?code=005930&page={page}')
              rows = [r for r in rows_of(html, 'type2') if re.match(r'\d{4}\.\d{2}\.\d{2}', r[0])]
              if rows:
                  print(f'page={page}: {len(rows)} rows, first={rows[0][0]}, last={rows[-1][0]}')
              else:
                  print(f'page={page}: no rows')

          print('\n=== market bizdate range test ===')
          for bd in ['20260701', '20260601', '20260101']:
              html = get(f'https://finance.naver.com/sise/investorDealTrendDay.naver?bizdate={bd}')
              rows = [r for r in rows_of(html, 'type_1') if re.match(r'\d{2}\.\d{2}\.\d{2}', r[0])]
              if rows:
                  print(f'bizdate={bd}: {len(rows)} rows, first={rows[0][0]}, last={rows[-1][0]}')
              else:
                  print(f'bizdate={bd}: no rows (아마 미래/휴장일 처리?)')
          EOF

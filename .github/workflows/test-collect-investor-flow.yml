name: TEST collect.py --investor-flow

on:
  workflow_dispatch:
    inputs:
      date:
        description: '조회 날짜 (YYYY-MM-DD)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 투자자 순매수 단독 조회 (커밋 안 함)
        run: |
          cd mtm-dashboard
          python3 collect.py --investor-flow "${{ github.event.inputs.date }}"
          echo "--- investor_flow_market.csv ---"
          cat data/investor_flow_market.csv || true
          echo "--- investor_flow_stock.csv ---"
          cat data/investor_flow_stock.csv || true

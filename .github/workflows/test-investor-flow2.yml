name: TEST 개별종목 기타법인 재확인

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 개별 종목 기타법인 재탐색 (2차)
        run: |
          python3 <<'EOF'
          import urllib.request, json

          headers = {'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'}

          candidates = [
              'https://m.stock.naver.com/api/stock/005930/integration',
              'https://m.stock.naver.com/api/stock/005930/investors',
              'https://api.stock.naver.com/stock/005930/integration',
              'https://finance.daum.net/api/investor/days?symbolCode=A005930',
              'https://finance.daum.net/api/quote/A005930/investors/days',
          ]
          for url in candidates:
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=8) as r:
                      body = r.read()
                      print(f'{url}\n  -> status {r.status}, len {len(body)}, head: {body[:300]!r}\n')
              except Exception as e:
                  print(f'{url}\n  -> fail: {repr(e)}\n')
          EOF

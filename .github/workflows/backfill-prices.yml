name: MtM 종가 소급 백필

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '소급 시작일 (YYYY-MM-DD)'
        required: true
      end_date:
        description: '소급 종료일 (YYYY-MM-DD). 비우면 오늘까지'
        required: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 소급 조회
        run: |
          cd mtm-dashboard
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            python3 collect.py --backfill-prices "${{ github.event.inputs.start_date }}" --backfill-prices-end "${{ github.event.inputs.end_date }}"
          else
            python3 collect.py --backfill-prices "${{ github.event.inputs.start_date }}"
          fi

      - name: 결과 커밋 & push
        run: |
          git config user.name "mtm-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mtm-dashboard/data/price_history.csv
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "종가 소급 백필 (${{ github.event.inputs.start_date }} ~ ${{ github.event.inputs.end_date }})"
            git push
          fi

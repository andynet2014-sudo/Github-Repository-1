name: MtM 일일 자동 수집

on:
  # 2026-09: 자체 cron 스케줄(schedule:)을 제거했다. 백업 cron까지 추가했는데도
  # 2026-09-01~09-03 5일 연속 미발동/수시간 드리프트가 반복됐고(WORK_LOG.md 참고),
  # 심지어 엉뚱한 시각에 발동해 개장 전 시세를 그날 종가로 잘못 캐싱한 사고까지
  # 있었다 — GitHub Actions cron 자체를 신뢰할 수 없다고 판단. 대신 Claude Code
  # Remote의 "MtM 종가 업데이트 확인" 체크인 루틴(하루 두 번, 국장/미장 마감 직후)이
  # 매번 이 workflow_dispatch를 직접 호출하는 방식으로 트리거를 단일화했다 —
  # 그 루틴은 지금까지 한 번도 안 빠지고 정확한 시각에 발동해왔다.
  workflow_dispatch:
    inputs:
      date:
        description: '대상 날짜(KST, YYYY-MM-DD). 비우면 자동 계산.'
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 대상 날짜(KST) 계산
        id: date
        run: |
          # github.event.schedule 문자열을 cron 표현과 그대로 비교하는 방식은
          # GitHub Actions 스케줄 발동 시각이 조금만 어긋나도(드리프트로 흔함)
          # 매칭에 실패해 엉뚱한 날짜로 커밋되는 사고가 반복됐다(2026-08-28).
          # 대신 발동된 실제 KST 시각으로 판단한다 — 정오 이전이면 "새벽 미장
          # 마감" 실행으로 보고 전날 날짜로 합치고, 정오 이후면 "당일 국장
          # 마감" 실행으로 오늘 날짜를 쓴다. 스케줄 시각이 몇 시간 밀려도 안전.
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(TZ='Asia/Seoul' date +%H)
            if [ "$HOUR" -lt 12 ]; then
              echo "target=$(TZ='Asia/Seoul' date -d yesterday +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
            else
              echo "target=$(TZ='Asia/Seoul' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 주말이면 스킵 (거래 없는 날 기록 방지)
        id: skip
        run: |
          DOW=$(TZ='Asia/Seoul' date -d "${{ steps.date.outputs.target }}" +%u)   # 6=토 7=일
          if [ -z "${{ github.event.inputs.date }}" ] && [ "$DOW" -ge 6 ]; then
            echo "대상 날짜(${{ steps.date.outputs.target }})가 주말 — 스킵"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: collect.py 실행
        if: steps.skip.outputs.skip != 'true'
        run: |
          cd mtm-dashboard
          python3 collect.py --date "${{ steps.date.outputs.target }}"

      - name: 오늘자 캔들(open/high/low) 보완 (price_history.csv, macro.csv)
        if: steps.skip.outputs.skip != 'true'
        run: |
          cd mtm-dashboard
          python3 collect.py --backfill-prices "${{ steps.date.outputs.target }}" --backfill-prices-end "${{ steps.date.outputs.target }}"
          python3 collect.py --backfill-macro "${{ steps.date.outputs.target }}" --backfill-macro-end "${{ steps.date.outputs.target }}"

      - name: 매크로 차트 데이터 대시보드에 주입 (data/macro.csv → risk-console.html)
        if: steps.skip.outputs.skip != 'true'
        run: |
          cd mtm-dashboard
          python3 dashboard/build_macro_chart.py

      - name: 주가 캔들차트 데이터 대시보드에 주입 (data/price_history.csv → risk-console.html)
        if: steps.skip.outputs.skip != 'true'
        run: |
          cd mtm-dashboard
          python3 dashboard/build_stock_charts.py

      - name: 결과 커밋 & push
        run: |
          git config user.name "mtm-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mtm-dashboard/data mtm-dashboard/dashboard/risk-console.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "자동 수집 (${{ steps.date.outputs.target }})"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 실패 — main이 그새 움직임, rebase 후 재시도 ($i/5)"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 push 실패"
          exit 1

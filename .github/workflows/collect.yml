name: MtM 일일 자동 수집

on:
  schedule:
    - cron: '0 7 * * 1-5'   # KST 16:00 (평일) — 국장 마감
    - cron: '0 22 * * 1-5'  # KST 07:00 다음날 (평일 저녁 UTC) — 미장 마감
  workflow_dispatch:
    inputs:
      date:
        description: '대상 날짜(KST, YYYY-MM-DD). 비우면 자동 계산.'
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 대상 날짜(KST) 계산
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 22 * * 1-5" ]; then
            # 새벽 07:00 KST 실행 = 전날 국장 마감분과 같은 거래일로 합침
            echo "target=$(TZ='Asia/Seoul' date -d yesterday +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          else
            echo "target=$(TZ='Asia/Seoul' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: collect.py 실행
        run: |
          cd mtm-dashboard
          python3 collect.py --date "${{ steps.date.outputs.target }}"

      - name: 결과 커밋 & push
        run: |
          git config user.name "mtm-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mtm-dashboard/data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 수집 (${{ steps.date.outputs.target }})"
            git push
          fi

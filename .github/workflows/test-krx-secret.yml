name: TEST KRX 시크릿 확인

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 시크릿 존재 여부만 확인(값은 출력 안 함)
        env:
          KRX_KEY: ${{ secrets.KRX_MARKETPLACE_API }}
        run: |
          if [ -n "$KRX_KEY" ]; then
            echo "SET (length: ${#KRX_KEY})"
          else
            echo "NOT SET"
          fi

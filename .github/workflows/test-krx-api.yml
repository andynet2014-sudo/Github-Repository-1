name: TEST KRX Open API 엔드포인트 탐색

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 후보 엔드포인트 호출 (AUTH_KEY 헤더, 응답 앞부분만 출력)
        env:
          KRX_KEY: ${{ secrets.KRX_MARKETPLACE_API }}
        run: |
          python3 <<'EOF'
          import urllib.request, os

          key = os.environ['KRX_KEY']
          headers = {'AUTH_KEY': key}

          candidates = [
              'http://data-dbg.krx.co.kr/svc/apis/sto/stk_bydd_trd?basDd=20260903',
              'http://data-dbg.krx.co.kr/svc/apis/sto/stk_invsto_trd?basDd=20260903',
              'http://data-dbg.krx.co.kr/svc/apis/sto/ksq_invsto_trd?basDd=20260903',
              'http://data-dbg.krx.co.kr/svc/apis/idx/kospi_dd_trd?basDd=20260903',
              'https://data-dbg.krx.co.kr/svc/apis/sto/stk_bydd_trd?basDd=20260903',
          ]
          for url in candidates:
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body = r.read()
                      print(f'{url}\n  -> status {r.status}, len {len(body)}, head: {body[:300]!r}\n')
              except Exception as e:
                  print(f'{url}\n  -> fail: {repr(e)}\n')
          EOF
